name: Verify frontend and account security
on:
  push:
    branches: [main, feat/deardaily-phase-2]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Start isolated local Supabase (no hosted credentials)
        run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup
