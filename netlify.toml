[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  VITE_ENABLE_PROFILE_IMAGES = "true"
VITE_ENABLE_YOUTUBE_MUSIC = "true"
VITE_ENABLE_PUBLIC_RHYTHM = "true"
VITE_ENABLE_LIVE_RHYTHM = "true"

# Preserve static assets; route all other paths through React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/auth/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
